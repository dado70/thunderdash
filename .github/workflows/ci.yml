name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/
      - run: npx --yes web-ext@10.7.0 lint --source-dir . --ignore-files "tests/**" "scripts/**" ".github/**" "dist/**"
